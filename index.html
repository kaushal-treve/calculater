<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Calculator — Precision Instrument</title>
  <meta name="description" content="A modern, accessible calculator web app built with HTML, CSS and vanilla JavaScript." />

  <!-- Google Fonts: JetBrains Mono for the readout & keycaps, Inter for UI chrome -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- Top bar: brand mark + utility toggles -->
  <header class="topbar">
    <div class="brand">
      <span class="brand-dot" aria-hidden="true"></span>
      <span class="brand-name">Calc<span class="brand-name-accent">/01</span></span>
    </div>

    <div class="topbar-controls">
      <button
        id="soundToggle"
        class="icon-btn"
        type="button"
        aria-pressed="true"
        aria-label="Toggle button sound effects"
        title="Toggle sound"
      >
        <svg class="icon icon-sound-on" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M4 9v6h4l5 5V4L8 9H4Z" fill="currentColor"/>
          <path d="M16.5 8.5a5 5 0 0 1 0 7" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
          <path d="M19 6a8.5 8.5 0 0 1 0 12" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" opacity="0.6"/>
        </svg>
        <svg class="icon icon-sound-off" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M4 9v6h4l5 5V4L8 9H4Z" fill="currentColor"/>
          <path d="M16 9l5 6M21 9l-5 6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
        </svg>
      </button>

      <button
        id="themeToggle"
        class="icon-btn"
        type="button"
        aria-pressed="false"
        aria-label="Toggle dark and light theme"
        title="Toggle theme"
      >
        <svg class="icon icon-sun" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <circle cx="12" cy="12" r="4.2" fill="currentColor"/>
          <g stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
            <path d="M12 2.5v2.4M12 19.1v2.4M4.6 4.6l1.7 1.7M17.7 17.7l1.7 1.7M2.5 12h2.4M19.1 12h2.4M4.6 19.4l1.7-1.7M17.7 6.3l1.7-1.7"/>
          </g>
        </svg>
        <svg class="icon icon-moon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a6.8 6.8 0 0 0 10.5 10.5Z" fill="currentColor"/>
        </svg>
      </button>
    </div>
  </header>

  <!-- Main application region -->
  <main class="app" role="main">

    <div class="console" id="console">

      <!-- History side panel -->
      <section
        id="historyPanel"
        class="history-panel"
        aria-label="Calculation history"
        aria-hidden="true"
      >
        <div class="history-head">
          <h2>History</h2>
          <button id="clearHistoryBtn" class="text-btn" type="button">Clear</button>
        </div>
        <ol id="historyList" class="history-list" aria-live="polite">
          <li class="history-empty" data-empty>No calculations yet</li>
        </ol>
      </section>

      <!-- The calculator itself -->
      <section class="calculator" aria-label="Calculator">

        <!-- Display / readout -->
        <div class="display" id="display">
          <div class="display-toprow">
            <button
              id="historyToggle"
              class="chip-btn"
              type="button"
              aria-expanded="false"
              aria-controls="historyPanel"
              aria-label="Show calculation history"
            >
              <svg viewBox="0 0 24 24" fill="none" aria-hidden="true" width="15" height="15">
                <path d="M4 4v5h5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
                <path d="M4.6 15a8 8 0 1 0 1.9-8.5L4 9" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
                <path d="M12 8v4.5l3 2" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
              History
            </button>

            <div class="memory-indicator" id="memoryIndicator" hidden>M</div>

            <button
              id="copyBtn"
              class="chip-btn"
              type="button"
              aria-label="Copy result to clipboard"
            >
              <svg viewBox="0 0 24 24" fill="none" aria-hidden="true" width="14" height="14">
                <rect x="8.5" y="8.5" width="10" height="12" rx="1.6" stroke="currentColor" stroke-width="1.6"/>
                <path d="M15.5 8.5V6.6A1.6 1.6 0 0 0 13.9 5H6.6A1.6 1.6 0 0 0 5 6.6v9.8A1.6 1.6 0 0 0 6.6 18h2" stroke="currentColor" stroke-width="1.6"/>
              </svg>
              <span id="copyLabel">Copy</span>
            </button>
          </div>

          <div class="display-expression" id="expression" aria-hidden="true">&nbsp;</div>
          <div class="display-result-row">
            <span
              id="result"
              class="display-result"
              role="status"
              aria-live="polite"
              aria-label="Calculator result"
            >0</span>
            <span class="display-cursor" aria-hidden="true"></span>
          </div>
        </div>

        <!-- Memory register row -->
        <div class="memory-row" role="group" aria-label="Memory operations">
          <button class="mem-btn" data-memory="mc" type="button" aria-label="Memory clear">MC</button>
          <button class="mem-btn" data-memory="mr" type="button" aria-label="Memory recall">MR</button>
          <button class="mem-btn" data-memory="m-" type="button" aria-label="Memory subtract">M&minus;</button>
          <button class="mem-btn" data-memory="m+" type="button" aria-label="Memory add">M+</button>
        </div>

        <!-- Keypad -->
        <div class="keypad" role="group" aria-label="Calculator keypad">

          <button class="key key-func key-danger" data-action="clear" type="button" aria-label="All clear">AC</button>
          <button class="key key-func" data-action="delete" type="button" aria-label="Delete last character">⌫</button>
          <button class="key key-func" data-action="percent" type="button" aria-label="Percent">%</button>
          <button class="key key-op" data-operator="÷" type="button" aria-label="Divide">÷</button>

          <button class="key key-num" data-number="7" type="button">7</button>
          <button class="key key-num" data-number="8" type="button">8</button>
          <button class="key key-num" data-number="9" type="button">9</button>
          <button class="key key-op" data-operator="×" type="button" aria-label="Multiply">×</button>

          <button class="key key-num" data-number="4" type="button">4</button>
          <button class="key key-num" data-number="5" type="button">5</button>
          <button class="key key-num" data-number="6" type="button">6</button>
          <button class="key key-op" data-operator="−" type="button" aria-label="Subtract">&minus;</button>

          <button class="key key-num" data-number="1" type="button">1</button>
          <button class="key key-num" data-number="2" type="button">2</button>
          <button class="key key-num" data-number="3" type="button">3</button>
          <button class="key key-op" data-operator="+" type="button" aria-label="Add">+</button>

          <button class="key key-func" data-action="sign" type="button" aria-label="Toggle positive or negative">+/&minus;</button>
          <button class="key key-num" data-number="0" type="button">0</button>
          <button class="key key-num" data-action="decimal" type="button" aria-label="Decimal point">.</button>
          <button class="key key-equals" data-action="equals" type="button" aria-label="Equals">=</button>

        </div>

        <p class="hint">Keyboard ready — numbers, + − * /, %, Enter, Backspace, Esc</p>
      </section>
    </div>
  </main>

  <footer class="page-footer">
    <p>Built with HTML, CSS &amp; vanilla JavaScript.</p>
  </footer>

  <!-- Visually hidden live region for error / status announcements -->
  <div id="srAnnouncer" class="sr-only" role="alert" aria-live="assertive"></div>

  <script src="script.js"></script>
</body>
</html>
